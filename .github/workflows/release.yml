name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go test -count=1 ./...
      - name: installer tests (bats, shellcheck)
        run: test/bats.sh
      - name: build release archive
        id: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/release.sh "$version"
          cp get.sh dist/get.sh
          (cd dist && sha256sum get.sh >>SHA256SUMS)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/runova-*-linux-amd64.tar.gz
            dist/get.sh
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Runova ${{ steps.build.outputs.version }}" \
            --generate-notes \
            dist/runova-*-linux-amd64.tar.gz dist/SHA256SUMS dist/get.sh
